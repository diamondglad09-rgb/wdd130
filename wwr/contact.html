<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gladys Edem">
    <title>Contact Us- White Water Rafting</title>

    <meta name="description" content="Have questions, feedback, or need support? kindly contact White Water Rafting easily by email, phone number, or by filling out our quick online form. would love to hear from you.">

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>

    <header>

        <img src="images/white-water.png" alt="Rafting Company Logo">

        <nav>
            <ul>

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>

            </ul>

        </nav>

    </header>

    <main>

        <div class="contact-info">
            <section class="company-name">
                <h1>White Water Rafting</h1>
                <p>Old Marian Street by ori</p>
                <p>Calabar City</p>
                <p>+2347013399078</p>
                <p>diamondglad09@gmail.com</p>
            </section>
        </div>


        <div class="map-form-container">

            <div class="map">

                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d106402.09079041136!2d8.391079787505623!3d4.972379982093431!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1795487536058!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>


            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="general" name="purpose" value="general"> General Inquiry </label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" id="website" name="purpose" value="website"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4"></textarea>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>


            </form>
        </div>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You!</h2>
            <div class="employee-profiles">

                <figure>
                    <img src="images/employee9.jpg" alt="Portrait of Hannah Brooks">
                    <figcaption>Hannah Brooks - Reservation & Guest Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of Jordan Hayes">
                    <figcaption>Jordan Hayes - River Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Chloe Ramirez">
                    <figcaption>Chloe Ramirez - Safety & Gear Coordinator</figcaption>
                </figure>


            </div>
        </section>

    </main>

    <footer>
        <p>©2026 🌵 Contact Us 🌵 White Water Rafting 🌵 Gladys Edem Asuquo 🌵 Nigeria</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-square.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-square.svg" alt="Instagram">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-square.svg" alt="Linkedin">
            </a>
        </nav>
    </footer>

</body>

</html>
